<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Média Notas</title>
        <link rel="stylesheet" href="style.css" type="text/css">
    </head>

    <body>
        <div class="Calculadora">
            <h2>Média de Notas</h2>
            <form class="FormCalculadora">
                <label for="nota1">Digite a Primeira Nota: </label>
                <input type="number" id="nota1" name="nota1" required class="pergunta">
                <br>
                <br>
                <label for="nota2">Digite a Segunda Nota: </label>
                <input type="number" id="nota2" name="nota2" required class="pergunta">
                <br>
                <br>
                <label for="nota3">Digite a Terceira Nota: </label>
                <input type="number" id="nota3" name="nota3" required class="pergunta">
                <br>
                <br>
                <label for="nota4">Digite a Quarta Nota </label>
                <input type="number" id="nota4" name="nota4" required class="pergunta">
                <br>
                <br>
                <button type="button" onclick="calcular()" class="botao">CALCULAR</button>
                <br>
                <br>
                <button type="reset" onclick="limpar()" class="botao">LIMPAR</button>
            </form>

            <div id="Resultado" class="Resultado">
                <h3>Resultado: </h3>
                <p id="media"></p>
            </div>
        </div>
    </body>

    <script src="script.js" type="text/javascript"></script>
</html>
